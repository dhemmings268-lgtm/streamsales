<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreamSales — Gestión de ventas</title>
<meta name="theme-color" content="#7C5CFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreamSales">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<style>
  :root{
    --primary:#7C5CFC; --primary-2:#A78BFA; --primary-container:#EDE7FF;
    --on-primary-container:#2A1065; --surface:#FAF8FF; --card:#FFFFFF;
    --card-2:#F3EFFB; --on-surface:#181325; --muted:#6B6580;
    --outline:#E6E0F3; --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
    --sky:#0EA5E9; --pink:#EC4899; --whatsapp:#25D366; --gold:#D4A017;
    --gold-2:#F5C842; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:radial-gradient(circle at 20% 0%, #DDD2FF 0%, #E7E2F4 45%, #D9D3EC 100%);
    color:var(--on-surface); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #app{position:relative;width:100%;max-width:430px;height:100vh;background:var(--surface);
    display:flex;flex-direction:column;overflow:hidden}
  @media (min-width:480px) and (min-height:720px){
    #app{height:92vh;max-height:940px;border-radius:34px;box-shadow:0 30px 80px rgba(28,20,60,.32)}
  }
  .ripple-host{position:relative;overflow:hidden;isolation:isolate}
  .ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(124,92,252,.28);
    pointer-events:none;animation:rippleAnim .65s cubic-bezier(.2,.8,.2,1) forwards;z-index:0}
  @keyframes rippleAnim{to{transform:scale(2.6);opacity:0}}

  #appbar{flex:0 0 auto;padding:14px 8px 10px 16px;display:flex;align-items:center;gap:6px;
    background:rgba(250,248,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid transparent;transition:border-color .25s, box-shadow .25s;z-index:5}
  #appbar.scrolled{border-bottom-color:var(--outline);box-shadow:0 6px 18px rgba(80,60,140,.06)}
  .ab-title{flex:1;min-width:0}
  .ab-title h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ab-title p{font-size:12px;margin:1px 0 0;color:var(--muted);font-weight:500}
  .ab-btn{width:42px;height:42px;flex:0 0 auto;border:0;background:transparent;border-radius:14px;
    display:grid;place-items:center;color:var(--on-surface);cursor:pointer;
    transition:background .18s, transform .12s, color .18s}
  .ab-btn:hover{background:var(--card-2);color:var(--primary)}
  .ab-btn:active{transform:scale(.9)}
  .ic{display:block;position:relative;z-index:1}

  #screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:160px;scrollbar-width:none;
    animation:fadeUp .32s cubic-bezier(.2,.8,.2,1)}
  #screen::-webkit-scrollbar{display:none}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .stagger > *{animation:staggerIn .38s cubic-bezier(.2,.8,.2,1) backwards}
  .stagger > *:nth-child(1){animation-delay:.02s}
  .stagger > *:nth-child(2){animation-delay:.05s}
  .stagger > *:nth-child(3){animation-delay:.08s}
  .stagger > *:nth-child(4){animation-delay:.11s}
  .stagger > *:nth-child(5){animation-delay:.14s}
  .stagger > *:nth-child(6){animation-delay:.17s}
  @keyframes staggerIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

  .section{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 10px}
  .section h2{font-size:15px;margin:0;font-weight:800;letter-spacing:-.2px}
  .section .count{font-size:12px;color:var(--muted);font-weight:600}
  .link{background:none;border:0;color:var(--primary);font-size:13px;font-weight:700;
    cursor:pointer;padding:4px 8px;border-radius:10px;transition:background .15s}
  .link:hover{background:var(--primary-container)}

  .card{background:var(--card);border:1px solid var(--outline);border-radius:var(--r);
    margin:6px 16px;overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .22s, border-color .2s}
  .card.tap{cursor:pointer}
  .card.tap:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(80,60,140,.1);border-color:#D9CEF5}
  .card.tap:active{transform:scale(.985)}
  .card.danger{border-left:4px solid var(--danger)}
  .card.warning{border-left:4px solid var(--warning)}
  .card.info{border-left:4px solid var(--sky)}

  .list-item{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;
    transition:background .18s;border:0;background:transparent;width:100%;text-align:left;
    font:inherit;color:inherit;position:relative;overflow:hidden}
  .list-item:hover{background:var(--card-2)}
  .list-item + .list-item{border-top:1px solid var(--outline)}

  .avatar{width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
    font-weight:800;font-size:16px;background:linear-gradient(135deg, var(--primary-container), #F0EAFE);
    color:var(--on-primary-container);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .avatar.round{border-radius:50%}
  .avatar.sm{width:36px;height:36px;border-radius:12px;font-size:13px}
  .avatar.tint{background:var(--card-2);color:var(--muted)}
  .avatar.gold{background:linear-gradient(135deg,#F5C842,#D4A017);color:#fff;box-shadow:0 4px 14px -4px rgba(212,160,23,.6)}

  .li-main{flex:1;min-width:0;position:relative;z-index:1}
  .li-main strong{display:block;font-size:14px;font-weight:700;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li-main span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .li-end{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;position:relative;z-index:1}
  .li-end b{font-size:14px;font-weight:800;letter-spacing:-.2px}
  .pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 0}
  .kpi{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;
    min-height:104px;position:relative;overflow:hidden;color:#fff;
    transition:transform .2s cubic-bezier(.2,.8,.2,1);cursor:pointer}
  .kpi:hover{transform:translateY(-3px)} .kpi:active{transform:scale(.97)}
  .kpi::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-40px;background:rgba(255,255,255,.14)}
  .kpi .ico{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.22);
    display:grid;place-items:center;color:#fff;position:relative;z-index:1}
  .kpi b{font-size:20px;font-weight:800;letter-spacing:-.6px;line-height:1;position:relative;z-index:1}
  .kpi small{font-size:11.5px;font-weight:600;opacity:.92;position:relative;z-index:1}
  .kpi.g1{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 10px 22px -8px rgba(16,185,129,.5)}
  .kpi.g2{background:linear-gradient(135deg,#8B5CF6,#6D28D9);box-shadow:0 10px 22px -8px rgba(139,92,246,.5)}
  .kpi.g3{background:linear-gradient(135deg,#0EA5E9,#0369A1);box-shadow:0 10px 22px -8px rgba(14,165,233,.5)}
  .kpi.g4{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 10px 22px -8px rgba(245,158,11,.5)}

  .quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 16px 0}
  .quick{background:var(--card);border:1px solid var(--outline);border-radius:16px;padding:13px 4px;
    display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10.5px;font-weight:700;
    color:var(--on-surface);cursor:pointer;text-align:center;line-height:1.25;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, border-color .2s;position:relative;overflow:hidden}
  .quick:hover{transform:translateY(-3px);border-color:#D9CEF5;box-shadow:0 8px 20px rgba(80,60,140,.1)}
  .quick:active{transform:scale(.94)}
  .quick .ic-wrap{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .quick:hover .ic-wrap{transform:scale(1.08) rotate(-4deg)}
  .q1 .ic-wrap{background:linear-gradient(135deg,#EDE7FF,#DDD2FF);color:#6D28D9}
  .q2 .ic-wrap{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#059669}
  .q3 .ic-wrap{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#D97706}
  .q4 .ic-wrap{background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#0369A1}

  .search-wrap{padding:2px 16px 10px}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
    padding:0 14px;height:48px;border:1.5px solid var(--outline);
    transition:border-color .18s, box-shadow .18s}
  .search:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,92,252,.12)}
  .search input{border:0;background:transparent;outline:0;font:inherit;font-size:14px;
    flex:1;color:var(--on-surface);min-width:0;font-weight:500}
  .search input::placeholder{color:#A29BBB}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--outline);background:var(--card);color:var(--muted);
    padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:all .2s cubic-bezier(.2,.8,.2,1)}
  .chip:hover{border-color:#D9CEF5;color:var(--primary)}
  .chip:active{transform:scale(.94)}
  .chip.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;
    color:#fff;box-shadow:0 6px 16px -4px rgba(124,92,252,.55)}

  .hero{background:var(--card);border:1px solid var(--outline);border-radius:var(--r);
    margin:6px 16px;padding:16px;animation:fadeUp .3s cubic-bezier(.2,.8,.2,1)}
  .hero.grad{background:linear-gradient(135deg,#7C5CFC 0%, #A78BFA 60%, #C4B5FD 100%);
    color:#fff;border:0;box-shadow:0 14px 34px -14px rgba(124,92,252,.65);position:relative;overflow:hidden}
  .hero.grad::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
    background:rgba(255,255,255,.12);right:-70px;top:-70px}
  .hero.grad .avatar{background:rgba(255,255,255,.25);color:#fff}
  .hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .hero-top .avatar{width:54px;height:54px;border-radius:18px;font-size:20px}
  .hero-top h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.25px}
  .hero-top small{color:var(--muted);font-size:12px;font-weight:550}
  .hero.grad .hero-top small{color:rgba(255,255,255,.85)}
  .rows{margin-top:14px;padding-top:14px;border-top:1px solid var(--outline);position:relative;z-index:1}
  .hero.grad .rows{border-top-color:rgba(255,255,255,.2)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px}
  .row span{color:var(--muted);font-weight:500}
  .hero.grad .row span{color:rgba(255,255,255,.8)}
  .row b{font-weight:700;text-align:right}
  .row.total b{color:#fff;font-size:15px}

  .btn-row{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px}
  .btn{border:0;border-radius:14px;padding:11px 16px;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), filter .18s, box-shadow .2s;
    position:relative;overflow:hidden}
  .btn:active{transform:scale(.94)}
  .btn.filled{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
    box-shadow:0 8px 20px -6px rgba(124,92,252,.55)}
  .btn.filled:hover{filter:brightness(1.08)}
  .btn.tonal{background:var(--primary-container);color:var(--on-primary-container)}
  .btn.outline{background:transparent;border:1.5px solid var(--outline);color:var(--on-surface)}
  .btn.outline:hover{background:var(--card-2)}
  .btn.wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;
    box-shadow:0 8px 20px -6px rgba(37,211,102,.55)}
  .btn.gcal{background:linear-gradient(135deg,#4285F4,#1a73e8);color:#fff;
    box-shadow:0 8px 20px -6px rgba(66,133,244,.55)}
  .btn.danger{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
  .btn.success{background:linear-gradient(135deg,#10B981,#059669);color:#fff;
    box-shadow:0 8px 20px -6px rgba(16,185,129,.55)}
  .btn.sm{padding:8px 12px;font-size:12px;border-radius:12px}

  .tabs{display:flex;gap:4px;margin:16px 16px 6px;background:var(--card-2);padding:4px;border-radius:14px}
  .tab{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-size:13px;
    font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .22s}
  .tab.on{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(80,60,140,.12)}

  .metrics{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--outline);margin-top:12px}
  .metric{flex:1;min-width:0}
  .metric small{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .metric b{display:block;font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px}

  .slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 0}
  .slot{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:11px;font-weight:800;
    cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.2,1);border:1.5px dashed transparent}
  .slot.filled{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
    border:0;box-shadow:0 6px 14px -6px rgba(124,92,252,.55)}
  .slot.filled:hover{transform:translateY(-2px) scale(1.03)}
  .slot.empty{background:var(--card-2);color:var(--muted);border-color:#D5CCF0}
  .slot.empty:hover{background:#EAE2FB;color:var(--primary);border-color:var(--primary)}
  .slot:active{transform:scale(.9)}

  .empty{text-align:center;padding:56px 32px;color:var(--muted)}
  .empty .ic{margin:0 auto 12px;color:#C4BCD8}
  .empty h3{margin:0 0 6px;font-size:15px;color:var(--on-surface);font-weight:750}
  .empty p{margin:0;font-size:13px;line-height:1.5}

  #nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(250,248,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--outline);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  @media (min-width:480px) and (min-height:720px){#nav{border-radius:0 0 34px 34px}}
  .nav-item{border:0;background:transparent;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;color:var(--muted);
    transition:color .22s;position:relative;overflow:hidden;border-radius:14px}
  .nav-item .ic{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .nav-item span{font-size:10.5px;font-weight:750;letter-spacing:.1px}
  .nav-item.on{color:var(--primary)}
  .nav-item.on .ic{transform:translateY(-2px) scale(1.12)}
  .nav-item.on::before{content:'';position:absolute;top:3px;width:26px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,var(--primary),var(--primary-2));animation:barIn .3s}
  @keyframes barIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
  .nav-item:active{transform:scale(.92)}

  #fab{position:absolute;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));height:52px;
    padding:0 20px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;font-family:inherit;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;
    cursor:pointer;box-shadow:0 12px 28px -8px rgba(124,92,252,.7);
    transition:transform .18s, box-shadow .22s, opacity .2s;z-index:19;overflow:hidden}
  #fab:hover{transform:translateY(-3px) scale(1.03)}
  #fab:active{transform:scale(.93)}
  #fab.hidden{opacity:0;pointer-events:none;transform:translateY(20px) scale(.9)}

  #sheet-root{position:absolute;inset:0;pointer-events:none;z-index:40}
  #sheet-root.open{pointer-events:auto}
  .scrim{position:absolute;inset:0;background:rgba(20,14,40,.5);opacity:0;transition:opacity .28s;backdrop-filter:blur(4px)}
  #sheet-root.open .scrim{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);
    transition:transform .34s cubic-bezier(.32,.72,0,1);max-height:92%;overflow-y:auto;
    box-shadow:0 -10px 40px rgba(80,60,140,.15)}
  @media (min-width:480px) and (min-height:720px){.sheet{border-radius:28px 28px 34px 34px}}
  #sheet-root.open .sheet{transform:translateY(0)}
  .grab{width:42px;height:4px;border-radius:4px;background:var(--outline);margin:4px auto 18px}
  .sheet h2{font-size:20px;margin:0 0 6px;font-weight:800;letter-spacing:-.4px}
  .sheet .sub{font-size:13px;color:var(--muted);margin:0 0 20px;font-weight:500}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .field select,.field input,.field textarea{width:100%;font:inherit;font-size:14px;color:var(--on-surface);
    font-weight:500;background:var(--card-2);border:1.5px solid transparent;border-radius:14px;
    padding:13px 14px;outline:0;transition:border-color .18s, box-shadow .18s;font-family:inherit;resize:none}
  .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--primary);
    background:#fff;box-shadow:0 0 0 4px rgba(124,92,252,.12)}
  .field .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet .btn{width:100%;justify-content:center;padding:15px;font-size:14.5px;border-radius:15px;margin-top:8px}
  .check-row{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
  .check-row input{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}

  #snack{position:absolute;left:16px;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));
    background:linear-gradient(135deg,#2A2438,#181325);color:#fff;padding:14px 18px;border-radius:15px;
    font-size:13px;font-weight:650;text-align:center;opacity:0;transform:translateY(18px);
    transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:50;
    box-shadow:0 12px 30px rgba(20,14,40,.3)}
  #snack.on{opacity:1;transform:none}

  .progress{height:6px;border-radius:6px;background:var(--card-2);overflow:hidden;margin-top:10px}
  .progress > div{height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .45s cubic-bezier(.2,.8,.2,1)}

  /* Onboarding */
  #onboarding{position:absolute;inset:0;background:linear-gradient(160deg,#FAF8FF 0%,#EDE7FF 100%);
    z-index:100;display:flex;flex-direction:column;padding:40px 26px 30px;overflow-y:auto}
  #onboarding.hidden{display:none}
  .ob-logo{width:76px;height:76px;border-radius:22px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;
    color:#fff;box-shadow:0 14px 34px -10px rgba(124,92,252,.6);margin-bottom:22px}
  #onboarding h1{font-size:26px;margin:0 0 8px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
  #onboarding p.lead{font-size:14px;color:var(--muted);margin:0 0 28px;line-height:1.5;font-weight:500}
  #onboarding .field label{color:var(--on-surface);font-weight:700}
  #onboarding .field input,#onboarding .field select{background:#fff;border:1.5px solid var(--outline)}
  #onboarding .btn{margin-top:12px}

  .badge-days{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
    font-size:11px;font-weight:800;letter-spacing:.1px}
  .badge-days.danger{background:rgba(239,68,68,.12);color:var(--danger)}
  .badge-days.warning{background:rgba(245,158,11,.14);color:#B45309}

const STORE_KEY = 'streamsales.v3';
const TODAY = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (n, base) => { const b = base ? new Date(base) : TODAY(); b.setDate(b.getDate()+n); b.setHours(0,0,0,0); return b; };
const addMonths = (n, base) => { const b = base ? new Date(base) : TODAY(); b.setMonth(b.getMonth()+n); b.setHours(0,0,0,0); return b; };

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || parsed.version !== 3) return null;
    return parsed;
  }catch(e){ return null; }
}

function saveStore(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    updateSyncBadge();
  }catch(e){ console.error('Error guardando', e); }
}

const daysDiff = (a, b) => {
  const A = new Date(a); A.setHours(0,0,0,0);
  const B = new Date(b); B.setHours(0,0,0,0);
  return Math.round((A - B) / 86400000);
};

/* =========================================================
   MODELO: CLIENTE
   ========================================================= */
const DISCOUNT_TIERS = [
  {min:5, pct:0.20},
  {min:3, pct:0.15}
];

function clientDiscountPct(client){
  const n = client.subs.length;
  for(const t of DISCOUNT_TIERS) if(n >= t.min) return t.pct;
  return 0;
}
function clientSubtotal(client){
  return client.subs.reduce((s, x) => s + Number(x.price||0), 0);
}
function clientDiscount(client){
  return clientSubtotal(client) * clientDiscountPct(client);
}
function clientTotal(client){
  return clientSubtotal(client) - clientDiscount(client);
}
function clientEarliestDue(client){
  if(!client.subs.length) return null;
  return client.subs.reduce((min, s) => {
    const d = new Date(s.due);
    return (!min || d < min) ? d : min;
  }, null);
}
function clientDaysUntilDue(client){
  const d = clientEarliestDue(client);
  if(!d) return null;
  return daysDiff(d, TODAY());
}
function clientStatus(client){
  if(!client.active) return {label:'Inactivo', color:'var(--muted)', type:'info'};
  const d = clientDaysUntilDue(client);
  if(d === null) return {label:'Sin subs', color:'var(--muted)', type:'info'};
  if(d < 0)  return {label:`${-d}d vencido`, color:'var(--danger)', type:'danger'};
  if(d === 0) return {label:'Vence hoy',    color:'var(--warning)', type:'warning'};
  if(d <= 3) return {label:`En ${d}d`,      color:'var(--warning)', type:'warning'};
  if(d <= 7) return {label:`En ${d}d`,      color:'var(--sky)',     type:'info'};
  return {label:`En ${d}d`, color:'var(--success)', type:'success'};
}
function clientDueToday(client){
  return client.subs.some(s => daysDiff(s.due, TODAY()) === 0);
}
function clientHasOverdue(client){
  return client.subs.some(s => daysDiff(s.due, TODAY()) < 0);
}

function go(screen, opts={}){
  if(state.screen !== screen) state.history.push({...state});
  state.screen = screen;
  if(opts.clientId !== undefined) state.clientId = opts.clientId;
  if(opts.clientTab) state.clientTab = opts.clientTab;
  if(opts.productId !== undefined) state.productId = opts.productId;
  if(opts.accountId !== undefined) state.accountId = opts.accountId;
  $('#screen').scrollTop = 0;
  render();
}
function goBack(){
  if(state.history.length){
    const prev = state.history.pop();
    Object.assign(state, prev, {history: state.history});
    render();
  } else go('dashboard');
}

/* ---------- CÁLCULOS ---------- */
function computeKPIs(){
  const now = new Date();
  const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const salesThisMonth = store.sales
    .filter(s => new Date(s.date) >= startMonth)
    .reduce((sum, s) => sum + Number(s.total||0), 0);

  const activeClients = store.clients.filter(c => c.active).length;

  const newThisMonth = store.clients.filter(c =>
    new Date(c.createdAt || 0) >= startMonth
  ).length;

  const pendingTotal = store.clients
    .filter(c => c.active && clientHasOverdue(c) || (c.active && clientDaysUntilDue(c) !== null && clientDaysUntilDue(c) >= 0 && clientDaysUntilDue(c) <= 7))
    .reduce((sum, c) => sum + clientTotal(c), 0);

  // Más simple: sumar todo lo que vence en <= 7 días (incluyendo vencidos)
  const pendingTotal2 = store.clients
    .filter(c => c.active && clientDaysUntilDue(c) !== null && clientDaysUntilDue(c) <= 7)
    .reduce((sum, c) => sum + clientTotal(c), 0);

  return {
    salesThisMonth,
    activeClients,
    newThisMonth,
    pendingTotal: pendingTotal2,
    incomeThisMonth: salesThisMonth * 0.42 // margen estimado
  };
}

function getClientsSortedByDue(){
  return store.clients
    .filter(c => c.active && c.subs.length > 0)
    .sort((a,b) => {
      const da = clientEarliestDue(a)?.getTime() || 0;
      const db = clientEarliestDue(b)?.getTime() || 0;
      return da - db;
    });
}

function receivablesSubtitle(){
  const list = getClientsSortedByDue();
  const overdue = list.filter(c => clientDaysUntilDue(c) < 0).length;
  const today = list.filter(c => clientDaysUntilDue(c) === 0).length;
  return `${overdue} vencidos · ${today} hoy · ${list.length} total`;
}

/* ---------- RECEIVABLE TILE ---------- */
function receivableTile(c){
  const st = clientStatus(c);
  const due = clientEarliestDue(c);
  const total = clientTotal(c);
  const d = clientDaysUntilDue(c);

  const cardClass = d < 0 ? 'danger' : d === 0 ? 'warning' : '';

  return `
    <div class="card tap ${cardClass}">
      <div class="list-item" data-action="open-client" data-id="${c.id}">
        <div class="avatar" style="${d<0?'background:linear-gradient(135deg,#FEE2E2,#FECACA);color:#B91C1C':''}">${esc(c.name.charAt(0))}</div>
        <div class="li-main">
          <strong>${esc(c.name)}</strong>
          <span>${c.subs.length} plataforma${c.subs.length!==1?'s':''} · vence ${due ? fmtDate(due) : '—'}</span>
          ${c.subs.length >= 3 ? `<span style="color:var(--primary);font-weight:700;font-size:11px;margin-top:3px">
            ${clientDiscountPct(c) === 0.20 ? '👑 Descuento 20%' : '⭐ Descuento 15%'}
          </span>` : ''}
        </div>

          <b>${money(total)}</b>

      </div>
    </div>`;
}

/* ---------- POR COBRAR ---------- */
function viewReceivables(){
  const list = getClientsSortedByDue();

  const overdue = list.filter(c => clientDaysUntilDue(c) < 0);
  const today = list.filter(c => clientDaysUntilDue(c) === 0);
  const week = list.filter(c => clientDaysUntilDue(c) > 0 && clientDaysUntilDue(c) <= 7);
  const upcoming = list.filter(c => clientDaysUntilDue(c) > 7);

  if(!list.length){
    return `<div class="empty">
      ${ic('check',54,1.4)}<h3>Todo al día</h3>
      <p>No tienes cobros pendientes por ahora.</p>
    </div>`;
  }

  const group = (title, arr, sub) => arr.length
    ? `<div class="section"><h2>${title}</h2><span class="count">${arr.length} · ${sub}</span></div>
       <div class="stagger">${arr.map(receivableTile).join('')}</div>`
    : '';

  return group('🔴 Vencidos', overdue, money(overdue.reduce((s,c)=>s+clientTotal(c),0)))
       + group('⏰ Vencen hoy', today, money(today.reduce((s,c)=>s+clientTotal(c),0)))
       + group('📅 Esta semana', week, money(week.reduce((s,c)=>s+clientTotal(c),0)))
       + group('📆 Próximos', upcoming, money(upcoming.reduce((s,c)=>s+clientTotal(c),0)));
}

const CLIENT_FILTERS = ['Todos','Activos','Vencen pronto','Inactivos'];

function getFilteredClients(){
  const q = state.clientsQuery.trim().toLowerCase();
  let list = store.clients.filter(c => {
    if(!q) return true;
    if(c.name.toLowerCase().includes(q)) return true;
    if((c.phone||'').toLowerCase().includes(q)) return true;
    return c.subs.some(s => {
      const p = getProduct(s.productId);
      return p && p.name.toLowerCase().includes(q);
    });
  });
  if(state.clientsFilter === 1) list = list.filter(c => c.active);
  if(state.clientsFilter === 2) list = list.filter(c => c.active && clientDaysUntilDue(c) !== null && clientDaysUntilDue(c) <= 7);
  if(state.clientsFilter === 3) list = list.filter(c => !c.active);
  return list.sort((a,b) => {
    const da = clientEarliestDue(a)?.getTime() || Infinity;
    const db = clientEarliestDue(b)?.getTime() || Infinity;
    return da - db;
  });
}

                    ${pill(dLabel, dColor)}
                  </div>
                </div>

          }).join('')}

  `;
}

function viewAccountDetail(){
  const res = getAccount(state.accountId);
  if(!res) return `<div class="empty"><h3>Cuenta no encontrada</h3></div>`;
  const {product, account} = res;
  const free = accountSlotsFree(account);
  const d = daysDiff(account.due, TODAY());
  const dColor = d < 0 ? 'var(--danger)' : d <= 3 ? 'var(--warning)' : 'var(--success)';
  const dLabel = d < 0 ? `${-d}d vencido` : d === 0 ? 'Vence hoy' : `En ${d}d`;

  const slots = [];
  account.clients.forEach(cid => {
    const c = store.clients.find(x => x.id === cid);
    slots.push({type:'filled', client:c, id:cid});
  });
  for(let i = 0; i < free; i++) slots.push({type:'empty'});

  const slotsHTML = slots.map(s => {
    if(s.type === 'filled'){
      const c = s.client;
      const initial = c ? c.name.charAt(0) : '?';
      return `<button class="slot filled" title="${esc(c ? c.name : '')}"
                 data-action="slot-filled" data-account="${account.id}" data-client="${s.id}">
                ${esc(initial)}
              </button>`;
    }
    return `<button class="slot empty" title="Agregar cliente"
               data-action="slot-empty" data-account="${account.id}">${ic('plus',18,2.4)}</button>`;
  }).join('');

  return `
    <div class="hero grad">
      <div class="hero-top">
        <div class="avatar" style="background:rgba(255,255,255,.25)">${ic('key',22,2.1)}</div>
        <div style="flex:1;min-width:0">
          <h3>${esc(account.label)}</h3>
          <small>${esc(product.name)}</small>
        </div>
      </div>
      <div class="rows">
        <div class="row"><span>Correo / Usuario</span><b>${esc(account.email)}</b></div>
        <div class="row"><span>Vencimiento</span><b>${fmtDate(account.due)}</b></div>
        <div class="row"><span>Estado</span><b>${dLabel}</b></div>
        <div class="row"><span>Cupos</span><b>${account.clients.length}/${account.maxClients} (${free} libre${free!==1?'s':''})</b></div>
      </div>
    </div>

    <div class="section">
      <h2>Cupos</h2>
      <button class="link ripple-host" data-action="slot-empty" data-account="${account.id}">+ Cliente</button>
    </div>
    <div class="card" style="padding:16px">
      <div class="slots">${slotsHTML}</div>
      <p style="margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center">
        Toca un cupo vacío para asignar un cliente
      </p>
    </div>

    <div class="section"><h2>Clientes en esta cuenta</h2></div>
    <div class="stagger">
      ${account.clients.length === 0
        ? `<div class="card" style="padding:20px;text-align:center;color:var(--muted);font-size:13px">
             Sin clientes asignados.
           </div>`
        : account.clients.map(cid => {
            const c = store.clients.find(x => x.id === cid);
            if(!c) return '';
            const st = clientStatus(c);
            return `
              <div class="card tap">
                <button class="list-item" data-action="open-client" data-id="${c.id}">
                  <div class="avatar sm">${esc(c.name.charAt(0))}</div>
                  <div class="li-main">
                    <strong>${esc(c.name)}</strong>
                    <span>${esc(c.phone||'')}</span>
                  </div>
                  <div class="li-end">${pill(st.label, st.color)}</div>
                </button>
              </div>`;
          }).join('')}
    </div>
  `;
}

function viewAccountsAvailable(){
  const groups = store.products

    ${groups.map(({product, accounts}) => `
      <div class="section"><h2>${esc(product.name)}</h2>

      </div>

/* ---------- VENTAS ---------- */
function viewSales(){
  const sales = [...store.sales].sort((a,b) => new Date(b.date) - new Date(a.date));
  const now = new Date();
  const thisMonth = sales.filter(s => {
    const d = new Date(s.date);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const totalMonth = thisMonth.reduce((s,x) => s + Number(x.total||0), 0);

  if(!sales.length){
    return `<div class="empty">
      ${ic('receipt',54,1.4)}<h3>Sin ventas registradas</h3>
      <p>Cuando cobres a un cliente aparecerá aquí.</p>
    </div>`;
  }

  return `
    <div class="hero grad">
      <div class="hero-top">
        <div class="avatar" style="background:rgba(255,255,255,.25)">${ic('trend',22,2)}</div>
        <div style="flex:1;min-width:0">
          <h3>${money(totalMonth)}</h3>
          <small>Vendido este mes · ${thisMonth.length} venta${thisMonth.length!==1?'s':''}</small>
        </div>
      </div>
    </div>

    <div class="section"><h2>Historial</h2><span class="count">${sales.length}</span></div>
    <div class="stagger">
      ${sales.map(s => {
        const c = store.clients.find(x => x.id === s.clientId);
        return `
          <div class="card">
            <button class="list-item" data-action="open-client" data-id="${s.clientId}">
              <div class="avatar sm" style="background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#059669">
                ${ic('check',17,2.3)}
              </div>
              <div class="li-main">
                <strong>${esc(c ? c.name : 'Cliente eliminado')}</strong>
                <span>${fmtDate(s.date)} · ${s.items.length} plataforma${s.items.length!==1?'s':''}${s.months>1?' · '+s.months+' meses':''}</span>
              </div>
              <div class="li-end">
                <b>${money(s.total)}</b>
                ${s.discount > 0 ? `<span style="font-size:11px;color:var(--success);font-weight:700">-${money(s.discount)}</span>` : ''}
              </div>
            </button>
          </div>`;
      }).join('')}
    </div>
  `;
}

/* ---------- REPORTES ---------- */
function viewReports(){
  const now = new Date();
  const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const salesMonth = store.sales.filter(s => new Date(s.date) >= startMonth);
  const totalMonth = salesMonth.reduce((s,x) => s + Number(x.total||0), 0);

  const newClients = store.clients.filter(c => new Date(c.createdAt || 0) >= startMonth);

  // No renovaron: clientes vencidos hace más de 3 días
  const notRenewed = store.clients.filter(c => {
    if(!c.active) return false;
    const d = clientDaysUntilDue(c);
    return d !== null && d < -3;
  });

  // Top cliente: mayor total vendido histórico
  const byClient = {};
  store.sales.forEach(s => {
    byClient[s.clientId] = (byClient[s.clientId] || 0) + Number(s.total||0);
  });
  let topClient = null, topAmount = 0;
  Object.entries(byClient).forEach(([cid, amt]) => {
    if(amt > topAmount){ topAmount = amt; topClient = cid; }
  });
  const topClientObj = topClient ? store.clients.find(c => c.id === topClient) : null;

  // Top productos
  const byProduct = {};
  store.sales.forEach(s => s.items.forEach(it => {
    byProduct[it.productId] = (byProduct[it.productId] || 0) + Number(it.price||0);
  }));
  const topProducts = Object.entries(byProduct)
    .map(([pid, amt]) => ({product:getProduct(pid), amount:amt}))
    .filter(x => x.product)
    .sort((a,b) => b.amount - a.amount)
    .slice(0,3);

  return `
    <div class="kpi-grid stagger">
      ${kpiCard('Vendido este mes', money(totalMonth), 'trend', 'g1')}
      ${kpiCard('Ventas', String(salesMonth.length), 'receipt', 'g2')}
      ${kpiCard('Clientes nuevos', String(newClients.length), 'userPlus', 'g3')}
      ${kpiCard('No renovaron', String(notRenewed.length), 'alert', 'g4')}
    </div>

    <div class="section"><h2>Top cliente 🏆</h2></div>
    ${topClientObj ? `
      <div class="card" style="border:2px solid var(--gold);
        background:linear-gradient(135deg, #FFFBF0 0%, #FFF6DC 100%)">
        <div class="list-item" style="cursor:default">
          <div class="avatar gold">${ic('crown',22,2.2)}</div>
          <div class="li-main">
            <strong class="gold-title" style="font-size:15px">${esc(topClientObj.name)}</strong>
            <span>${topClientObj.subs.length} plataformas · cliente top histórico</span>
          </div>
          <div class="li-end">
            <b class="gold-title" style="font-size:16px">${money(topAmount)}</b>
          </div>
        </div>
      </div>
    ` : `<div class="card" style="padding:16px;color:var(--muted);text-align:center;font-size:13px">
        Aún no hay ventas registradas.
      </div>`}

    <div class="section"><h2>Top productos</h2></div>
    ${topProducts.length === 0
      ? `<div class="card" style="padding:16px;color:var(--muted);text-align:center;font-size:13px">
           Sin datos todavía.
         </div>`
      : topProducts.map((tp, i) => `
          <div class="card">
            <div class="list-item" style="cursor:default">
              <div class="avatar sm" style="background:linear-gradient(135deg,var(--primary-container),#E0D6FF);color:var(--primary)">
                ${i+1}º
              </div>
              <div class="li-main">
                <strong>${esc(tp.product.name)}</strong>
                <span>${esc(tp.product.category)}</span>
              </div>
              <div class="li-end"><b>${money(tp.amount)}</b></div>
            </div>
          </div>`).join('')}

    ${notRenewed.length > 0 ? `
      <div class="section"><h2>⚠️ No renovaron</h2><span class="count">${notRenewed.length}</span></div>
      <div class="stagger">
        ${notRenewed.slice(0,5).map(c => receivableTile(c)).join('')}
      </div>
    ` : ''}
  `;
}

function render(){
  renderAppBar();

  const views = {
    dashboard: viewDashboard,
    receivables: viewReceivables,
    clients: viewClients,
    clientDetail: viewClientDetail,
    products: viewProducts,
    productDetail: viewProductDetail,
    accountDetail: viewAccountDetail,
    accountsAvailable: viewAccountsAvailable,
    sales: viewSales,
    reports: viewReports,
    reminders: viewReminders,
    more: viewMore,
    suppliers: viewSuppliers,
    settings: viewSettings
  };

  const sc = $('#screen');
  sc.style.animation = 'none'; void sc.offsetHeight; sc.style.animation = '';
  sc.innerHTML = (views[state.screen] || viewDashboard)();

  const active = TAB_OF[state.screen];
  $('#nav').innerHTML = NAV.map(n => `
    <button class="nav-item ripple-host ${n.id===active?'on':''}" data-action="go" data-go="${n.id}">
      ${ic(n.icon, 22, n.id===active?2.2:1.9)}
      <span>${n.label}</span>
    </button>`).join('');

  const showFab = ['dashboard','receivables','clients'].includes(state.screen);
  $('#fab').classList.toggle('hidden', !showFab);

  if(state.screen === 'clients' && state._focusSearch){
    const inp = $('#client-search');
    if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    state._focusSearch = false;
  }
}

  // Productos disponibles que tiene cuentas con cupo

  store.products.forEach(p => {
    const freeAccs = p.accounts.filter(a => accountSlotsFree(a) > 0);
    if(freeAccs.length) available.push({product:p, accounts:freeAccs});
  });

  if(!available.length){
    return openSheet(`

      <button class="btn outline ripple-host" data-action="close-sheet" style="width:100%;justify-content:center">Cerrar</button>

  }

  const prodOpts = available.map(x =>
    `<option value="${x.product.id}">${esc(x.product.name)} — ${money(x.product.price)}</option>`
  ).join('');

  openSheet(`
    <h2>Agregar plataforma</h2>
    <p class="sub">Vincula una nueva plataforma a ${esc(c.name)}</p>

    <div class="field">
      <label>Producto</label>
      <select id="as-product">${prodOpts}</select>
    </div>

    <div class="field">
      <label>Cuenta asignada</label>
      <select id="as-account"></select>
    </div>

    <div class="field">
      <label>Ciclo de facturación</label>
      <select id="as-cycle">
        <option value="30">Mensual (30 días)</option>
        <option value="14">Quincenal (14 días)</option>
        <option value="60">Bimestral (60 días)</option>
      </select>
    </div>

    <div class="field">
      <label>Fecha de vencimiento</label>
      <input id="as-due" type="date" value="${toDateInput(addDays(30))}">
    </div>

    <div class="field">
      <label>Precio personalizado (opcional)</label>
      <input id="as-price" type="number" step="0.01" placeholder="Dejar vacío para usar precio del producto">
    </div>

    <button class="btn filled ripple-host" data-action="save-add-sub" data-client="${clientId}" style="width:100%;justify-content:center">
      ${ic('check',18,2.2)} Agregar plataforma
    </button>
  `);

  // Rellenar cuentas del primer producto
  const fillAccounts = () => {
    const pid = $('#as-product').value;
    const entry = available.find(x => x.product.id === pid);
    if(!entry) return;
    $('#as-account').innerHTML = entry.accounts.map(a =>
      `<option value="${a.id}">${esc(a.label)} (${accountSlotsFree(a)} libres)</option>`
    ).join('');
  };
  fillAccounts();
  $('#as-product').addEventListener('change', fillAccounts);
}

/* ---------- REGISTRAR PAGO ---------- */
function openPay(clientId){
  const c = store.clients.find(x => x.id === clientId);
  if(!c || !c.subs.length) return;

  const subtotal = clientSubtotal(c);
  const discount = clientDiscount(c);
  const total = clientTotal(c);
  const discPct = clientDiscountPct(c);

  openSheet(`
    <h2>Registrar pago</h2>
    <p class="sub">${esc(c.name)} · ${c.subs.length} plataforma${c.subs.length!==1?'s':''}</p>

    <div class="card" style="margin:0 0 16px;background:var(--card-2);border:0;padding:14px">
      <div class="row"><span>Subtotal</span><b>${money(subtotal)}</b></div>
      ${discount > 0 ? `<div class="row"><span>Descuento (${discPct*100}%)</span><b style="color:var(--success)">-${money(discount)}</b></div>` : ''}
      <div class="row" style="border-top:1px solid var(--outline);padding-top:10px;margin-top:6px">
        <span style="font-weight:700;color:var(--on-surface)">Total a cobrar</span>
        <b style="font-size:16px">${money(total)}</b>
      </div>
    </div>

    <div class="field">
      <label>¿Cuántos meses paga?</label>
      <select id="pay-months">
        <option value="1">1 mes (${money(total)})</option>
        <option value="2">2 meses (${money(total*2)})</option>
      </select>
    </div>

    <div class="field">
      <label>Método de pago</label>
      <select id="pay-method">
        <option value="transfer">Transferencia</option>
      </select>
    </div>

    <p style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 4px;line-height:1.5">
      El vencimiento se extenderá ${'<b>1 mes</b>'} desde la fecha actual de vencimiento.
    </p>

    <button class="btn success ripple-host" data-action="save-pay" data-id="${clientId}" style="width:100%;justify-content:center">
      ${ic('check',18,2.2)} Confirmar pago
    </button>
  `);
}

/* ---------- NO RENOVÓ ---------- */
function openNoRenew(clientId){

  if(!c) return;
  openSheet(`
    <h2>¿No renovó?</h2>
    <p class="sub">${esc(c.name)} dejará de estar activo. Podrás reactivarlo después.</p>
    <button class="btn danger ripple-host" data-action="confirm-no-renew" data-id="${clientId}" style="width:100%;justify-content:center">

/* ---------- ASIGNAR CLIENTE A CUENTA ---------- */
function openPickClient(accountId){
  const res = getAccount(accountId);
  if(!res) return;
  const {product, account} = res;
  const free = accountSlotsFree(account);

  if(free <= 0){
    return toast('Esta cuenta está llena');
  }

  const available = store.clients.filter(c => !account.clients.includes(c.id) && c.active);

  openSheet(`
    <h2>Asignar cliente</h2>
    <p class="sub">${esc(product.name)} · ${esc(account.label)} · ${free} cupo${free!==1?'s':''} libre${free!==1?'s':''}</p>

    ${available.length === 0
      ? `<div class="empty" style="padding:36px 16px">
           ${ic('users',44,1.4)}<h3>Sin clientes disponibles</h3>
           <p>Todos tus clientes activos ya están en esta cuenta.</p>
         </div>`
      : available.map(c => `
          <div class="list-item ripple-host" data-action="assign-client" data-account="${accountId}" data-client="${c.id}" style="border-radius:14px">
            <div class="avatar sm">${esc(c.name.charAt(0))}</div>
            <div class="li-main">
              <strong>${esc(c.name)}</strong>
              <span>${c.subs.length} plataforma${c.subs.length!==1?'s':''}</span>
            </div>
            <div style="color:var(--primary)">${ic('plus',20,2.2)}</div>
          </div>`).join('')}
  `);
}

/* =========================================================
   SNACKBAR
   ========================================================= */
let snackTimer;
function toast(msg){
  const el = $('#snack');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove('on'), 2000);
}

/* =========================================================
   GOOGLE CALENDAR
   ========================================================= */
function addToGoogleCalendar(client){
  const due = clientEarliestDue(client);
  if(!due) return;
  const start = new Date(due);
  start.setHours(9,0,0,0);
  const end = new Date(start.getTime() + 30*60*1000);

  const pad = n => String(n).padStart(2,'0');
  const fmtG = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

  const title = `Cobrar a ${client.name}`;
  const details = `${client.subs.length} plataforma${client.subs.length!==1?'s':''} · Total ${money(clientTotal(client))}`;
  const dates = `${fmtG(start)}/${fmtG(end)}`;

  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}&details=${encodeURIComponent(details)}`;
  window.open(url, '_blank', 'noopener');
}

/* =========================================================
   WHATSAPP
   ========================================================= */
function openWhatsApp(client){
  const phone = (client.phone||'').replace(/\D/g,'');
  if(!phone) return toast('Este cliente no tiene teléfono');
  const msg = `Hola ${client.name} hoy se vence su cuenta/sus cuentas de Servicios contratados, desea renovar otro mes?`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

/* =========================================================
   ACCIONES DE COBRO
   ========================================================= */
function registerPayment(clientId, months){
  const c = store.clients.find(x => x.id === clientId);
  if(!c) return;

  const items = c.subs.map(s => {
    const p = getProduct(s.productId);
    return {productId:s.productId, accountId:s.accountId, price:s.price, productName: p ? p.name : ''};
  });
  const subtotal = items.reduce((s,it) => s + it.price, 0);
  const discPct = clientDiscountPct(c);
  const discount = subtotal * discPct;
  const totalPerMonth = subtotal - discount;
  const total = totalPerMonth * months;

  // Extender vencimiento
  c.subs.forEach(s => {
    const base = new Date(s.due);
    base.setMonth(base.getMonth() + months);
    s.due = base.toISOString();
  });

  // Registrar venta
  store.sales.push({
    id: uid('sale-'),
    clientId: c.id,
    date: new Date().toISOString(),
    items, subtotal, discount, total,
    months,
    method: 'transfer'
  });

  saveStore();
  toast(`Pago registrado · ${money(total)}`);
  closeSheet();
  render();
}

function markNoRenew(clientId){
  const c = store.clients.find(x => x.id === clientId);
  if(!c) return;
  c.active = false;
  saveStore();
  toast(`${c.name} marcado como no renovado`);
  closeSheet();
  render();
}

/* =========================================================
   RIPPLE
   ========================================================= */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.ripple-host, .btn, .chip, .tab, .quick, .nav-item, .ab-btn, .list-item, .kpi');
  if(!el) return;
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - r.left - size/2) + 'px';
  ripple.style.top = (e.clientY - r.top - size/2) + 'px';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);
});

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(a === 'go'){ return go(el.dataset.go); }
  if(a === 'back'){ return goBack(); }
  if(a === 'toast'){ return toast(el.dataset.msg || 'Acción'); }
  if(a === 'close-sheet'){ return closeSheet(); }
  if(a === 'reset'){ return resetStore(); }

  // Clientes
  if(a === 'new-client'){ return openNewClient(); }
  if(a === 'save-new-client'){
    const name = $('#nc-name').value.trim();
    if(!name) return toast('Ingresa un nombre');
    const phone = $('#nc-phone').value.trim();
    const notes = $('#nc-notes').value.trim();
    const client = {
      id: uid('c-'), name, phone, notes, active: true,
      subs: [],
      createdAt: new Date().toISOString()
    };
    store.clients.push(client);
    saveStore();
    closeSheet();
    toast('Cliente creado');
    return render();
  }
  if(a === 'edit-client'){ return openEditClient(el.dataset.id); }
  if(a === 'save-edit-client'){
    const c = store.clients.find(x => x.id === el.dataset.id);
    if(!c) return;
    c.name = $('#ec-name').value.trim() || c.name;
    c.phone = $('#ec-phone').value.trim();
    c.active = $('#ec-active').value === '1';
    saveStore();
    closeSheet();
    toast('Cliente actualizado');
    return render();
  }
  if(a === 'open-client'){
    return go('clientDetail', {clientId: el.dataset.id, clientTab:'resumen'});
  }
  if(a === 'open-client-from-sheet'){
    closeSheet();
    setTimeout(() => go('clientDetail', {clientId: el.dataset.id, clientTab:'resumen'}), 300);
    return;
  }
  if(a === 'client-tab'){
    state.clientTab = el.dataset.tab;
    return render();
  }
  if(a === 'filter-clients'){
    state.clientsFilter = Number(el.dataset.value);
    return render();
  }
  if(a === 'save-notes'){
    const c = store.clients.find(x => x.id === el.dataset.id);
    if(!c) return;
    c.notes = $('#client-notes').value;
    saveStore();
    return toast('Nota guardada');
  }

  // Subs
  if(a === 'add-sub'){ return openAddSub(el.dataset.id); }
  if(a === 'save-add-sub'){
    const c = store.clients.find(x => x.id === el.dataset.client);
    if(!c) return;
    const pid = $('#as-product').value;
    const aid = $('#as-account').value;
    const cycle = Number($('#as-cycle').value);
    const due = $('#as-due').value ? new Date($('#as-due').value + 'T00:00:00') : addDays(cycle);
    const priceCustom = $('#as-price').value;
    const p = getProduct(pid);
    const price = priceCustom ? Number(priceCustom) : (p ? p.price : 0);

    if(!c.subs) c.subs = [];
    c.subs.push({
      id: uid('sub-'), productId: pid, accountId: aid,
      cycleDays: cycle, due: due.toISOString(), price
    });

    // Vincular cliente a la cuenta
    const res = getAccount(aid);
    if(res && !res.account.clients.includes(c.id)) res.account.clients.push(c.id);

    saveStore();
    closeSheet();
    toast('Plataforma agregada');
    return render();
  }
  if(a === 'remove-sub'){
    const c = store.clients.find(x => x.id === el.dataset.client);
    if(!c) return;
    const subId = el.dataset.sub;
    const sub = c.subs.find(s => s.id === subId);
    if(sub){
      const res = getAccount(sub.accountId);
      if(res) res.account.clients = res.account.clients.filter(x => x !== c.id);
    }
    c.subs = c.subs.filter(s => s.id !== subId);
    saveStore();
    return render();
  }

  // Pago
  if(a === 'open-pay'){ return openPay(el.dataset.id); }
  if(a === 'save-pay'){
    const months = Number($('#pay-months').value) || 1;
    return registerPayment(el.dataset.id, months);
  }
  if(a === 'no-renew'){ return openNoRenew(el.dataset.id); }
  if(a === 'confirm-no-renew'){ return markNoRenew(el.dataset.id); }

  // Productos
  if(a === 'open-product'){ return go('productDetail', {productId: el.dataset.id}); }
  if(a === 'open-account'){ return go('accountDetail', {accountId: el.dataset.id}); }
  if(a === 'filter-products'){
    state.productCategory = el.dataset.value;
    return render();
  }
  if(a === 'add-account'){ return openAddAccount(el.dataset.product); }
  if(a === 'save-account'){
    const p = getProduct(el.dataset.product);
    if(!p) return;
    const label = $('#acc-label').value.trim() || 'Cuenta';
    const email = $('#acc-email').value.trim() || 'cuenta@servicio.com';
    const max = Math.max(1, Math.min(20, parseInt($('#acc-max').value) || 5));
    const dueStr = $('#acc-due').value;
    const notes = $('#acc-notes').value.trim();
    const due = dueStr ? new Date(dueStr + 'T00:00:00') : addDays(30);
    p.accounts.push({
      id: uid('a-'), label, email, maxClients:max, clients:[], due: due.toISOString(), notes
    });
    saveStore();
    closeSheet();
    toast('Cuenta creada');
    return render();
  }
  if(a === 'slot-empty'){ return openPickClient(el.dataset.account); }
  if(a === 'slot-filled'){ return openSlotActions(el.dataset.account, el.dataset.client); }
  if(a === 'assign-client'){
    const res = getAccount(el.dataset.account);
    if(!res) return;
    const cid = el.dataset.client;
    if(res.account.clients.length >= res.account.maxClients) return toast('Cuenta llena');
    if(!res.account.clients.includes(cid)) res.account.clients.push(cid);
    saveStore();
    closeSheet();
    toast('Cliente asignado');
    return render();
  }
  if(a === 'remove-client'){
    const res = getAccount(el.dataset.account);
    if(!res) return;
    res.account.clients = res.account.clients.filter(x => x !== el.dataset.client);
    saveStore();
    closeSheet();
    toast('Cliente removido');
    return render();
  }

  // WhatsApp y Calendar
  if(a === 'whatsapp'){
    const c = store.clients.find(x => x.id === el.dataset.id);
    if(c) openWhatsApp(c);
    return;
  }
  if(a === 'gcal'){
    const c = store.clients.find(x => x.id === el.dataset.id);
    if(c) addToGoogleCalendar(c);
    return;
  }

  // Settings
  if(a === 'save-profile'){
    if(!store.profile) store.profile = {};
    store.profile.name = $('#set-name').value.trim() || store.profile.name;
    store.profile.business = $('#set-business').value.trim();
    store.profile.phone = $('#set-phone').value.trim();
    store.profile.email = $('#set-email').value.trim();
    saveStore();
    return toast('Perfil actualizado');
  }
});

});

  if(e.key === 'Escape' && $('#sheet-root').classList.contains('open')) closeSheet();

/* =========================================================
   INICIO
   ========================================================= */
function init(){
  const loaded = loadStore();
  if(loaded && loaded.profile){
    store = loaded;
    // Migración suave: asegurar campos
    store.clients.forEach(c => { if(!c.subs) c.subs = []; });
    store.products.forEach(p => p.accounts.forEach(a => { if(!a.clients) a.clients = []; }));
    render();
  } else {
    store = defaultStore();
    saveStore();
    showOnboarding();
  }
}
init();
</script>
<script>
// ==================== PWA ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch((err) => console.warn('SW no registrado:', err));
  });
}

// Banner de instalación
let deferredPrompt = null;
const banner = document.createElement('div');
banner.id = 'pwa-banner';
banner.innerHTML = `
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;border-radius:12px;flex:0 0 auto;
      background:linear-gradient(135deg,#7C5CFC,#A78BFA);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px">
      ▶
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:13.5px;font-weight:800;color:#181325;letter-spacing:-.2px">
        Instalar StreamSales
      </div>
      <div style="font-size:11.5px;color:#6B6580;margin-top:2px">
        Acceso rápido desde tu pantalla de inicio
      </div>
    </div>
    <button id="pwa-install" style="border:0;background:linear-gradient(135deg,#7C5CFC,#A78BFA);
      color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;padding:9px 14px;
      border-radius:12px;cursor:pointer;white-space:nowrap">Instalar</button>
    <button id="pwa-dismiss" style="border:0;background:transparent;color:#6B6580;
      font-size:20px;cursor:pointer;padding:4px 8px;line-height:1">×</button>
  </div>`;
banner.style.cssText = `
  position:absolute;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));
  background:#fff;border:1.5px solid #E6E0F3;border-radius:16px;padding:12px 14px;
  box-shadow:0 14px 34px -10px rgba(80,60,140,.35);
  z-index:60;transform:translateY(140%);opacity:0;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
`;
document.getElementById('app').appendChild(banner);

function showBanner() {
  if (localStorage.getItem('pwa-dismissed') === '1') return;
  banner.style.transform = 'translateY(0)';
  banner.style.opacity = '1';
}
function hideBanner() {
  banner.style.transform = 'translateY(140%)';
  banner.style.opacity = '0';
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(showBanner, 2500);
});

document.getElementById('pwa-install').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    console.log('PWA instalada');
    hideBanner();
  }
  deferredPrompt = null;
});

document.getElementById('pwa-dismiss').addEventListener('click', () => {
  localStorage.setItem('pwa-dismissed', '1');
  hideBanner();
});

window.addEventListener('appinstalled', () => {
  hideBanner();
  localStorage.setItem('pwa-dismissed', '1');
});
</script>
